---
- name: Run Mailcow backup now
  hosts: mailcow
  become: true
  gather_facts: false
  tasks:
    - name: Start backup service
      ansible.builtin.systemd:
        name: pfif-mailcow-backup.service
        state: started
    - name: Show latest backup
      ansible.builtin.shell: >-
        set -o pipefail;
        find {{ mailcow_backup_path }}
        -maxdepth 1
        -type d
        -name 'mailcow-*'
        -printf '%f\\n'
        | sort
        | tail -1
      args:
        executable: /bin/bash
      register: latest_backup
      changed_when: false
    - name: Print backup name
      ansible.builtin.debug:
        msg: "Latest backup: {{ latest_backup.stdout }}"
